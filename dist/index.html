  <body class="h-full bg-gray-100">
    <!-- 
    # Usando valores arbitrarios
    Nos vamos a encontrar en casos donde los valores
    defaults que Tailwind trae no alcanzan.
    Sino que necesitamos poder especificar nuestros
    propios valores.
    Una forma de resolverlo, por supuesto, es 
    escribiendo el CSS directamente.
    Pero si necesitamos usar un valor que solo tiene
    que estar en un único lugar ("one-off"), entonces
    podemos aprovechar los valores arbitrarios de 
    Tailwind.
    Se usan escribiendo:
      .identificador-[valor]

    Por ejemplo, si escribimos:
      h-[33px]
      => .h-\[33px\] { height: 33px }
    
    ¡Importante!
    Si el valor contiene espacios, como no son
    caracteres permitidos de nombre de clase en
    CSS, los reemplazamos por "_".
    -->
    <div id="app" class="grid grid-rows-[60px_1fr_100px] h-full"></div>
  </body>
